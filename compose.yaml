services:
  postgres:
    image: postgres:16
    container_name: pantry-postgres
    environment:
      POSTGRES_DB: pantry
      POSTGRES_USER: pantry
      POSTGRES_PASSWORD: pantry
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantry -d pantry"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
      - pantry-postgres-data:/var/lib/postgresql/data

volumes:
  # Fresh-reset contract: `npm run db:reset` (canonical) and the documented
  # clean-migration path both use `docker compose down -v` so this named
  # volume is removed. Plain `docker compose down` deliberately keeps it.
  pantry-postgres-data: